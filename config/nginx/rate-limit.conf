# Loaded in the nginx http context. Directives are inherited by server/location
# unless a more specific location overrides them. Both HTTP and HTTPS share it.
limit_req_zone $binary_remote_addr zone=waflab_per_ip:10m rate=20r/s;
limit_req zone=waflab_per_ip burst=40 nodelay;
limit_req_status 429;
limit_req_log_level warn;
# Enforcement enabled; set on for detection-only benchmark exercises.
limit_req_dry_run off;
